schemaVersion: 1

package:
  name: nikrun-lsp-protocol
  version: 0.1.0
  description: Standalone Language Server Protocol (LSP 3.17) and JSON-RPC 2.0 library for Free Pascal
  license: GPL-3.0-or-later
  repository: https://github.com/nikrun/cli

  build:
    mode: objfpc
    longStrings: true
    modeSwitches:
      - advancedrecords
    unitPaths:
      - src

  # Tests are the *.test.pas fpcunit units next to the units in src/ (discovered by 'nik test').
  test:
    toolchain:
      fpc: 3.3.1
    build:
      assertions: true
      heaptrc: true
      checks:
        - range
        - overflow
        - io
