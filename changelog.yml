changelog:
  - version: 0.2.0
    changes:
      added:
        - 'Automatically download, SHA-256-verify, and configure missing Free Pascal SDKs on `nik build` (unless `--offline` is set), with `toolchain.sdkInstalled` reporting in `nik build --json`'
        - 'Display installed SDK directory sizes and total disk usage in `nik sdk list` and `nik sdk info`, including `sizeBytes` and `totalSizeBytes` in `--json` output'
        - 'Add built-in `nik.yaml` manifest intelligence to `nik lsp` (`Hover` with `ppc*` flag explanations and live SDK/`nik.lock` status, context-aware key/enum/path `Completion`, dynamic `toolchain.fpc` suggestions combining installed and cached online SDKs, `DocumentSymbol` outline, and `Go to Definition`)'
      changed:
        - 'Reject YAML anchors, aliases and tags in `nik.yaml` with a clear error (quote the value to use it literally) and accept only plain decimal integers for numeric fields'
      deprecated: []
      fixed:
        - 'Parse apostrophes and double quotes inside unquoted `nik.yaml` values (for example `description: Don''t panic`) and write `nik.lock` entries with quotes, indicators or `null` so the file always reads back'
        - 'Accept blank and comment-only lines that contain tabs in `nik.yaml`, and bound the nesting depth of flow collections instead of overflowing the stack'
      removed: []
      security: []
  - version: 0.1.0
    date: '2026-11-18'
    changes:
      added:
        - 'Initial release of the `nik` CLI and standalone `nikrun-lsp-protocol` library'
        - 'Add `nik sdk` commands (`list`, `install`, `update`, `info`, `uninstall`) with commit-aware update detection, SHA-256 verification, and `--json` output'
        - 'Add `nik init` project scaffolder (`--program`, `--lib`, `--pkg`) with `~/.nikrun/template.yaml` blueprint support'
        - 'Add `nik pkg` decentralized URL and local-path package manager (`fetch`, `update`, `list`, `info`) with MVS and `nik.lock` SHA-256 verification'
        - 'Add `nik build` declarative compiler orchestrator over `nik.yaml` (`targets`, `profiles`, structured `--json` diagnostics)'
        - 'Add `nik lsp` built-in Free Pascal Language Server (LSP 3.17) with live unsaved buffer overlays, diagnostics, symbols, Go to Definition, Hover, Signature Help, and Completion'
      changed: []
      deprecated: []
      fixed: []
      removed: []
      security:
        - 'Harden Windows process startup against working-directory DLL hijacking (`SetDefaultDllDirectories`)'
