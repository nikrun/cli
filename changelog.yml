changelog:
  - version: 0.2.0
    changes:
      added:
        - 'Automatically download, SHA-256-verify, and configure missing Free Pascal SDKs on `nik build` (unless `--offline` is set), with `toolchain.sdkInstalled` reporting in `nik build --json`'
        - 'Display installed SDK directory sizes and total disk usage in `nik sdk list` and `nik sdk info`, including `sizeBytes` and `totalSizeBytes` in `--json` output'
        - 'Add built-in `nik.yaml` manifest intelligence to `nik lsp` (`Hover` with `ppc*` flag explanations and live SDK/`nik.lock` status, context-aware key/enum/path `Completion`, dynamic `toolchain.fpc` suggestions combining installed and cached online SDKs, `DocumentSymbol` outline, and `Go to Definition`)'
      changed:
        - 'Reject YAML anchors, aliases and tags in `nik.yaml` with a clear error (quote the value to use it literally) and accept only plain decimal integers for numeric fields'
      deprecated: []
      fixed:
        - 'Append `.exe`, `.dll`, `.so` or `.dylib` to a default output name that contains a dot (`name: Acme.Tools`), which was mistaken for a file extension'
        - 'Stop zip extraction through `tar`/`unzip` from hanging on tools that print many warnings (their output is drained now), and prefer the system `tar.exe` over a `tar.exe` found earlier in `PATH` on Windows'
        - 'Report argument errors, unknown commands and unexpected exceptions as a JSON object on stdout (empty stderr) when `--json` is given, instead of plain text on stderr'
        - 'Write `nik.lock`, config and manifest files by renaming a finished temporary file over the target, so an interrupted run or a concurrent reader never sees a truncated file'
        - 'Report a permanent directory-move failure at once with the operating-system reason instead of retrying 25 times, and remove Windows junctions and directory symlinks inside a deleted tree as links instead of failing on them'
        - 'Keep the `nik.lock` entries of other targets, including their transitive packages, when `nik build` rewrites the lock for the active target, so `--locked` builds on another OS no longer fail after a local build'
        - 'Verify a commit-pinned dependency against the integrity recorded in `nik.lock` during `nik pkg update` instead of silently overwriting it'
        - 'Reject project names with path separators, `..`, drive colons or wildcards in `nik init` and in `nik.yaml` (a program named `../../x` wrote its binary outside the project), check the name before the SDK lookup, create the project directory only after validation, and never generate a program or unit whose identifier is a reserved word or hides a standard unit (`types`, `math`, `classes`, ...)'
        - 'Stop `nik lsp` from burning a full CPU core when queued re-checks cannot start because the workspace has no usable `nik.yaml` or SDK'
        - 'Parse apostrophes and double quotes inside unquoted `nik.yaml` values (for example `description: Don''t panic`) and write `nik.lock` entries with quotes, indicators or `null` so the file always reads back'
        - 'Accept blank and comment-only lines that contain tabs in `nik.yaml`, and bound the nesting depth of flow collections instead of overflowing the stack'
      removed: []
      security:
        - 'Unpack `.tar.gz` packages through a temporary file instead of memory and refuse archives that unpack to more than 2 GiB, so a small gzip bomb can no longer exhaust RAM'
        - 'Refuse to install a remote SDK whose index entry has no `sha256` unless `--skip-verify` is passed, instead of installing it unverified'
        - 'Require a 40-digit hexadecimal `rev` for Git entries in `nik.lock` and validate every commit before it reaches `git` or a cache path, closing option injection (`--upload-pack=…`) and path traversal through a crafted lock file'
        - 'Reject SDK ids, archive file names and manifest paths that could leave `~/.nikrun` (`..`, separators, drive letters) when reading `index.json` and `sdk-manifest.json`'
  - version: 0.1.0
    date: '2026-11-18'
    changes:
      added:
        - 'Initial release of the `nik` CLI and standalone `nikrun-lsp-protocol` library'
        - 'Add `nik sdk` commands (`list`, `install`, `update`, `info`, `uninstall`) with commit-aware update detection, SHA-256 verification, and `--json` output'
        - 'Add `nik init` project scaffolder (`--program`, `--lib`, `--pkg`) with `~/.nikrun/template.yaml` blueprint support'
        - 'Add `nik pkg` decentralized URL and local-path package manager (`fetch`, `update`, `list`, `info`) with MVS and `nik.lock` SHA-256 verification'
        - 'Add `nik build` declarative compiler orchestrator over `nik.yaml` (`targets`, `profiles`, structured `--json` diagnostics)'
        - 'Add `nik lsp` built-in Free Pascal Language Server (LSP 3.17) with live unsaved buffer overlays, diagnostics, symbols, Go to Definition, Hover, Signature Help, and Completion'
      changed: []
      deprecated: []
      fixed: []
      removed: []
      security:
        - 'Harden Windows process startup against working-directory DLL hijacking (`SetDefaultDllDirectories`)'
