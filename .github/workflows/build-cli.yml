name: Build nik CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      sdk_version:
        description: 'Prebuilt Nikrun FPC SDK version from nikrun/sdk latest release (e.g. latest, 3.3.1, 3.2.4)'
        required: true
        default: 'latest'
        type: string
      skip_tests:
        description: 'Skip running the CLI integration test suite'
        required: true
        default: false
        type: boolean

concurrency:
  group: build-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-cli:
    name: "nik CLI (${{ matrix.target_cpu }}-${{ matrix.target_os }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: win64
            target_cpu: x86_64
            runner: windows-latest
          - target_os: win64
            target_cpu: aarch64
            runner: windows-11-arm
          - target_os: linux
            target_cpu: x86_64
            runner: ubuntu-24.04
          - target_os: linux
            target_cpu: aarch64
            runner: ubuntu-24.04-arm
          - target_os: darwin
            target_cpu: x86_64
            runner: macos-15-intel
          - target_os: darwin
            target_cpu: aarch64
            runner: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare Latest Nikrun FPC SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_TARGET_OS: ${{ matrix.target_os }}
          MATRIX_TARGET_CPU: ${{ matrix.target_cpu }}
          INPUT_SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          $params = @{
            TargetOs   = $env:MATRIX_TARGET_OS
            TargetCpu  = $env:MATRIX_TARGET_CPU
            SdkVersion = if ([string]::IsNullOrWhiteSpace($env:INPUT_SDK_VERSION)) { 'latest' } else { $env:INPUT_SDK_VERSION }
          }

          ./prepare.ps1 @params

      - name: Build nik CLI
        shell: pwsh
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          $profile = if ([string]::IsNullOrWhiteSpace($env:INPUT_PROFILE)) { 'release' } else { $env:INPUT_PROFILE }
          ./build.ps1 -Profile $profile -Clean -StageDist | Out-Null

      - name: Test nik CLI
        if: inputs.skip_tests != true && inputs.skip_tests != 'true'
        shell: pwsh
        run: |
          ./test.ps1 -SkipBuild

      - name: Publish CLI Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: nik-${{ matrix.target_cpu }}-${{ matrix.target_os }}
          path: dist/cli/${{ matrix.target_cpu }}-${{ matrix.target_os }}/*
          if-no-files-found: error
