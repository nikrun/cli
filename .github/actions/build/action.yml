name: Build and Test Nikrun CLI
description: Encapsulates bootstrap nik setup, native Free Pascal compilation via nik build, testing, and ZIP packaging for the nik CLI

inputs:
  clean-version:
    description: 'Clean version string (e.g., 0.1.0)'
    required: false
    default: ''
  version-tag:
    description: 'Explicit version tag string (e.g., v0.1.0-build.42-channel.insider). If empty, calculated automatically.'
    required: false
    default: ''
  channel:
    description: 'Release channel used when calculating version tag (dev, insider, stable)'
    required: false
    default: 'dev'
  run-tests:
    description: 'Run build-lib, lsp-protocol, and CLI integration tests'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory path'
    required: false
    default: '.'
  github-token:
    description: 'GitHub token for repository/release operations and submodules'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Configure Git Submodule Authentication
      if: inputs.github-token != ''
      shell: pwsh
      env:
        INPUT_TOKEN: ${{ inputs.github-token }}
      run: |
        git config --global "url.https://$($env:INPUT_TOKEN)@github.com/nikrun/.insteadOf" "https://github.com/nikrun/"

    - name: Initialize Submodules
      shell: pwsh
      run: |
        Set-Location "${{ inputs.working-directory }}"
        git submodule update --init --recursive --depth 1

    - name: Resolve Version
      id: context
      shell: pwsh
      env:
        INPUT_CLEAN_VERSION: ${{ inputs.clean-version }}
        INPUT_VERSION_TAG: ${{ inputs.version-tag }}
        INPUT_CHANNEL: ${{ inputs.channel }}
      run: |
        Set-Location "${{ inputs.working-directory }}"

        if (-not [string]::IsNullOrWhiteSpace($env:INPUT_CLEAN_VERSION)) {
          $cleanVer = $env:INPUT_CLEAN_VERSION.Trim() -replace '^v', ''
        } elseif (Test-Path 'version.txt') {
          $cleanVer = ((Get-Content 'version.txt' -Raw).Trim()) -replace '^v', ''
        } else {
          $cleanVer = '0.1.0'
        }

        if (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION_TAG)) {
          $verTag = $env:INPUT_VERSION_TAG.Trim()
        } else {
          $buildNum = if ($env:GITHUB_RUN_NUMBER) { $env:GITHUB_RUN_NUMBER } else { '0' }
          $chan = if ($env:INPUT_CHANNEL) { $env:INPUT_CHANNEL } else { 'dev' }
          $verTag = "v${cleanVer}-build.${buildNum}-channel.${chan}"
        }

        [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "clean_version=$cleanVer`nversion_tag=$verTag`n", [System.Text.UTF8Encoding]::new($false))

    # build.ps1 compiles the CLI with the released nik; nik installs the Free Pascal SDK pinned in nik.yaml on demand.
    - name: Install Bootstrap nik
      uses: nikrun/github-setup-nik@v1
      with:
        channel: stable
        github-token: ${{ inputs.github-token || github.token }}

    - name: Build and Test Artifacts
      id: build
      shell: pwsh
      env:
        VERSION_TAG: ${{ steps.context.outputs.version_tag }}
        INPUT_RUN_TESTS: ${{ inputs.run-tests }}
      run: |
        Set-Location "${{ inputs.working-directory }}"
        $runTests = ("$env:INPUT_RUN_TESTS".Trim().ToLowerInvariant() -ne 'false')
        ./build.ps1 -OutDir artifacts -Version $env:VERSION_TAG -Profile release -Clean -RunTests:$runTests | Out-Null

        $zip = Get-ChildItem -Path 'artifacts' -Filter "nik-$($env:VERSION_TAG)-*.zip" | Select-Object -First 1
        if (-not $zip) {
          throw "Expected CLI ZIP archive was not produced in artifacts/"
        }
        $triplet = $zip.BaseName -replace ("^nik-" + [regex]::Escape($env:VERSION_TAG) + "-"), ''
        [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "triplet=$triplet`n", [System.Text.UTF8Encoding]::new($false))

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nik-${{ steps.build.outputs.triplet }}
        path: ${{ inputs.working-directory }}/artifacts/nik-*.zip
        if-no-files-found: error
        retention-days: 1
