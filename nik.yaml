schemaVersion: 1

program:
  name: nik
  description: Nikrun CLI - modern zero-config toolchain for Free Pascal & Object Pascal
  license: GPL-3.0-or-later
  repository: https://github.com/nikrun/cli
  entry: src/nik.pas
  output: bin/nik

  toolchain:
    fpc: 3.3.1

  build:
    mode: objfpc
    longStrings: true
    unitPaths:
      - src
      - vendor/lazarus/components/lazutils
      - vendor/lazarus/components/codetools
    includePaths:
      - vendor/lazarus/components/lazutils
      - vendor/lazarus/components/codetools
      - .work/generated
    defines:
      - NIK_HAS_BUILD_VERSION
    # -FF: compile res/nik.rc with fpcres (the default windres fails on the aarch64-win64 SDK)
    fpcArgs:
      - -FF

  dependencies:
    nikrun-lsp-protocol: ./lsp-protocol
