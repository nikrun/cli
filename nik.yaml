schemaVersion: 1

program:
  name: nik
  description: Nikrun CLI - modern zero-config toolchain for Free Pascal & Object Pascal
  license: GPL-3.0-or-later
  repository: https://github.com/nikrun/cli
  entry: src/nik.pas
  output: bin/nik

  toolchain:
    fpc: 3.3.1

  build:
    mode: objfpc
    longStrings: true
    unitPaths:
      - src
      - vendor/lazarus/components/lazutils
      - vendor/lazarus/components/codetools
    includePaths:
      - vendor/lazarus/components/lazutils
      - vendor/lazarus/components/codetools

  # Icon and file properties of nik.exe. Linked through the generated unit nikmanifest (used by nik.types),
  # which also provides NIK_VERSION; build.ps1 passes the release tag with --build-version.
  windows:
    icon: brand/ico/nikrun.ico
    info:
      product: Nikrun CLI

  dependencies:
    nikrun-lsp-protocol: ./lsp-protocol
